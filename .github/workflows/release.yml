name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default; jobs that need more ask for it themselves
permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check types
        run: npm run check:types

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:unit:coverage

      # The only build of the release: the jobs below ship this exact output
      - name: Build project
        run: npm run build

      - name: Run smoke tests of the built package
        run: npm run test:artifacts

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Needed for CHANGELOG.md
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d')
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            dist/js/bootstrap-sheet.js
            dist/js/bootstrap-sheet.min.js
            dist/js/bootstrap-sheet.esm.js
            dist/js/*.map
            dist/css/bootstrap-sheet.css
            dist/css/bootstrap-sheet.min.css
            dist/css/*.map
            dist/types/*.d.ts
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest

    # OIDC trusted publishing: npm authenticates through a short-lived token
    # minted from this job's identity, so no NPM_TOKEN is needed.
    permissions:
      contents: read
      id-token: write

    steps:
      # Needed for the package manifest, README, LICENSE and sources
      - name: Checkout code
        uses: actions/checkout@v7

      # Trusted publishing needs npm >= 11.5.1. The Node line in .nvmrc, 24 or
      # later, ships a newer npm (11.19 with 26.10), so npm is used as bundled
      # rather than upgraded to whatever version is latest at release time.
      # check-latest takes the newest release of that line, not an older one
      # that happens to be cached on the runner.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # No token: npm detects the trusted publisher and authenticates via OIDC,
      # and attaches a provenance attestation automatically. The test job has
      # already built and tested this commit, so lifecycle scripts are skipped:
      # prepublishOnly would only build and test it again.
      - name: Publish to npm
        run: npm publish --ignore-scripts
