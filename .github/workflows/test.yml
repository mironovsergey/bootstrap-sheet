name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node ${{ matrix.node }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Maintenance LTS, active LTS, and the line that becomes LTS next
        node: [22, 24, 26]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check types
        run: npm run check:types

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:unit:coverage

      # Coverage does not depend on the Node version or the OS, so it is
      # uploaded once, from the oldest line in the matrix
      - name: Upload coverage to Codecov
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-bootstrap-sheet
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build artifacts
        run: |
          test -f dist/js/bootstrap-sheet.js
          test -f dist/js/bootstrap-sheet.min.js
          test -f dist/js/bootstrap-sheet.esm.js
          test -f dist/js/bootstrap-sheet.cjs
          test -f dist/css/bootstrap-sheet.css
          test -f dist/css/bootstrap-sheet.min.css
          test -f dist/types/bootstrap-sheet.d.ts
          test -f dist/types/bootstrap-sheet.d.cts

      - name: Run smoke tests of the built package
        run: npm run test:artifacts

      - name: Lint the package manifest and entry points
        run: npm run lint:package

      - name: Check bundle sizes
        run: npm run size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7
